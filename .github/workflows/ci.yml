name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create valid fixture
        run: |
          mkdir -p .github
          cat > .github/dependabot.yml <<'YAML'
          version: 2
          updates:
            - package-ecosystem: pip
              directory: /
              schedule:
                interval: weekly
              open-pull-requests-limit: 5
              ignore:
                - dependency-name: "*"
                  update-types:
                    - version-update:semver-major
            - package-ecosystem: github-actions
              directory: /
              schedule:
                interval: weekly
              open-pull-requests-limit: 5
              ignore:
                - dependency-name: "*"
                  update-types:
                    - version-update:semver-major
          YAML

      - name: Run action
        uses: ./
