site_name: Safe Dependabot
site_description: Conservative, ecosystem-aware Dependabot policy validation for GitHub repositories.
site_url: https://diogoribeiro7.github.io/safe-dependabot/
repo_url: https://github.com/DiogoRibeiro7/safe-dependabot
repo_name: DiogoRibeiro7/safe-dependabot
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Ecosystem detection: ecosystems.md
  - Policy rules: policy.md
  - Examples: examples.md
  - Development: development.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

copyright: Copyright &copy; 2026 Diogo Ribeiro
